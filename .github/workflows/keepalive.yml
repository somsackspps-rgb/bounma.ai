# Supabase free projects are paused after ~7 days without activity. This pings the API twice a week.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> add SUPABASE_URL and SUPABASE_ANON_KEY
name: Supabase keep-alive
on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/classroom_groups?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
